name: Deploy DemandLint to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

# Both values below are intentionally public browser configuration. Never add a Supabase secret
# key or SMTP credential to this workflow.
env:
  VITE_SUPABASE_URL: https://pvbqjpsmyxujksjjxcah.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EgH9aPjXSmTfKepBGc_cRA_Vg6UAVMd
  VITE_AUTH_GOOGLE_ENABLED: "false"
  VITE_AUTH_MICROSOFT_ENABLED: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate hosted account configuration
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Typecheck, test and build
        run: npm run ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
